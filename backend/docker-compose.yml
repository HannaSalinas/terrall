services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: terrall
      POSTGRES_PASSWORD: terrall
      POSTGRES_DB: terrall
    ports:
      - "5432:5432"
    volumes:
      - terrall-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrall -d terrall"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://terrall:terrall@db:5432/terrall?schema=public
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  terrall-db:
